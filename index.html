    .modal{position:absolute;z-index:120;inset:0;display:grid;place-items:center;padding:22px;background:rgba(61,42,101,.46);backdrop-filter:blur(5px);animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0}}.panel{width:min(92vw,520px);max-height:86dvh;overflow-x:hidden;overflow-y:auto;padding:24px 18px 20px;border:5px solid #fff;border-radius:38px;background:linear-gradient(#fffbd6,#dff7ff);box-shadow:0 16px 0 rgba(60,42,91,.18),0 20px 45px rgba(41,30,75,.3);text-align:center}.panel h2{margin:0 0 16px;font-size:clamp(26px,7vw,38px)}.modal-actions{display:flex;gap:13px;justify-content:center;margin-top:18px}.modal-actions .big-btn{height:65px;padding:0 25px;border-radius:34px;font-size:23px}.new-card{font-size:100px;animation:newSticker .75s ease infinite alternate}@keyframes newSticker{to{transform:translateY(-18px) rotate(8deg) scale(1.12)}}.big-new{font-size:55px;color:#ff5aa5;text-shadow:0 4px #fff,0 8px #8f67d6}
    .collection{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.sticker,.item-btn{aspect-ratio:1;border-radius:24px;display:grid;place-items:center;font-size:39px;background:linear-gradient(#fff,#dff7ff);border:3px solid #fff;box-shadow:0 5px 0 rgba(86,67,120,.16)}.sticker.locked{filter:grayscale(1);opacity:.65}.dress-avatar{width:155px;height:155px;margin:0 auto 14px}.dress-avatar .avatar{font-size:112px}.dress-avatar .wear.hat{top:-4px;font-size:42px}.dress-avatar .wear.glasses{top:58px;font-size:35px}.dress-avatar .wear.accessory{font-size:38px}.item-btn{font-size:33px}.item-btn.equipped{outline:5px solid #ffd85a}.tabs{display:flex;justify-content:center;gap:8px;margin:10px}.tab{padding:8px 14px;border-radius:20px;background:#dacdf6}.tab.on{background:#ffd85a}
    .toast{position:absolute;z-index:220;left:50%;top:13%;transform:translateX(-50%);padding:11px 20px;border-radius:25px;background:#fff;color:var(--ink);box-shadow:var(--shadow);font-size:18px;white-space:nowrap;animation:toast 1.8s ease forwards}@keyframes toast{0%{transform:translate(-50%,-30px);opacity:0}18%,70%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-25px);opacity:0}}
    .rainbow-wipe{position:absolute;z-index:300;inset:-30%;background:conic-gradient(#ff738d,#ffd54e,#78dc72,#62ceff,#a987ef,#ff83bd,#ff738d);transform:scale(0);border-radius:50%;pointer-events:none}.rainbow-wipe.go{animation:wipe .72s ease-in-out}@keyframes wipe{45%,58%{transform:scale(1.7)}to{transform:scale(0)}}
    .event-object{position:absolute;z-index:75;font-size:82px;filter:drop-shadow(0 8px 5px rgba(50,48,90,.25));animation:eventArrive 1s ease,placeBob 2s 1s infinite;cursor:pointer}.event-label{position:absolute;z-index:76;top:-12px;left:50%;transform:translateX(-50%);font-size:24px;background:#fff;border-radius:20px;padding:5px 10px}.event-object.center{left:50%;top:46%;transform:translate(-50%,-50%)}@keyframes eventArrive{from{transform:translate(-50%,-50%) scale(0) rotate(-180deg)}}
    .confetti-bg{background:linear-gradient(135deg,#ff8bc4,#ffd85a,#78e1ff,#b89cff);background-size:300% 300%;animation:bgShift 3s ease infinite}@keyframes bgShift{50%{background-position:100% 100%}}
    .hold-reset{position:relative;height:68px;width:210px;border-radius:35px;background:#ff8aa6;overflow:hidden;color:#fff;font-size:21px;box-shadow:0 7px 0 #c65378}.hold-reset .progress{position:absolute;left:0;bottom:0;top:0;width:0;background:rgba(255,255,255,.32);pointer-events:none}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 8px;font-size:21px}.switch{width:76px;height:43px;border-radius:25px;background:#aaa;padding:4px;box-shadow:inset 0 3px 6px rgba(0,0,0,.2)}.switch:before{content:"";display:block;width:35px;height:35px;border-radius:50%;background:#fff;transition:.25s}.switch.on{background:#65d66f}.switch.on:before{transform:translateX(33px)}
    .idle-spark{position:absolute;z-index:20;left:50%;top:-18px;font-size:28px;animation:float 1s infinite}.result-stars{font-size:55px;letter-spacing:5px;animation:newSticker .8s ease infinite alternate}.chest-open{font-size:110px;animation:chestOpen 1.1s ease}@keyframes chestOpen{0%,28%{transform:rotate(-8deg)}14%,42%{transform:rotate(8deg)}65%{transform:scale(1.22);filter:drop-shadow(0 0 25px #fff660)}to{transform:scale(1)}}
    .parent-link{position:absolute;z-index:50;right:7px;bottom:calc(6px + env(safe-area-inset-bottom));width:37px;height:37px;border-radius:50%;background:rgba(255,255,255,.68);font-size:19px;box-shadow:0 3px 0 rgba(72,61,110,.17)}
    @media (max-height:700px){.title-wrap{top:8%}.hero-animal{bottom:18%;font-size:90px}.start-btn{height:72px;bottom:4%}.island{height:72vh;top:55%}.place{width:72px;height:72px;font-size:34px}.place small{font-size:10px}.map-egg{font-size:25px}.topbar{transform:scale(.88);transform-origin:top left;right:-42px}.answers{top:40%;bottom:3%}.target-ring{top:15%;width:92px;height:92px;font-size:61px}.instrument{height:84px}}
    @media (min-width:700px){.island{height:76vh}.panel{padding:30px}.collection{grid-template-columns:repeat(6,1fr)}}
    @media (prefers-reduced-motion:reduce){.cloud,.bird,.butterfly{animation-duration:30s}}
  </style>

<body>
<main id="app" aria-label="奇妙动物岛大冒险"></main>
<div id="particle-layer" aria-hidden="true"></div>
<div id="rainbow-wipe" class="rainbow-wipe"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='magicAnimalIslandSave';
  const CHARACTERS=['🐰','🐼','🐶','🐱','🦊'];
  const STICKERS=['🐰','🐱','🐶','🐼','🦊','🐸','🐯','🦁','🐵','🐧','🐨','🐷','🐮','🐔','🐙','🐠','🐳','🐬','🦄','🦖','🐝','🦋','🐢','🦀'];
  const ITEMS=[
    {id:'crown',icon:'👑',slot:'hat'},{id:'straw',icon:'👒',slot:'hat'},{id:'party',icon:'🥳',slot:'hat'},{id:'bow',icon:'🎀',slot:'hat'},
    {id:'sun',icon:'😎',slot:'glasses'},{id:'round',icon:'🤓',slot:'glasses'},{id:'magic',icon:'🧙',slot:'hat'},{id:'flower',icon:'🌸',slot:'hat'},
    {id:'redscarf',icon:'🧣',slot:'accessory'},{id:'bluebow',icon:'💙',slot:'accessory'},{id:'balloon',icon:'🎈',slot:'accessory'},{id:'duck',icon:'🐤',slot:'accessory'},
    {id:'dino',icon:'🦖',slot:'accessory'},{id:'penguin',icon:'🐧',slot:'accessory'},{id:'wand',icon:'🪄',slot:'accessory'},{id:'wings',icon:'🌈',slot:'accessory'},
    {id:'bag',icon:'🎒',slot:'accessory'},{id:'bell',icon:'🔔',slot:'accessory'},{id:'bunny',icon:'🐰',slot:'hat'},{id:'cat',icon:'🐱',slot:'hat'}
  ];
  const DEFAULT_STATE={stars:0,character:'',stickers:[],inventory:[],equipped:{hat:'',glasses:'',accessory:''},unlocked:[],highScores:{fruit:0,animal:0,color:0,train:0,bubble:0,music:0},soundEnabled:true,totalPlayTime:0,chestsOpened:0,lastRestAt:0,milestones:[],gamesPlayed:0};
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const rand=(a,b)=>Math.random()*(b-a)+a, pick=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>[...a].sort(()=>Math.random()-.5), clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), clone=v=>JSON.parse(JSON.stringify(v));

  class StorageManager{
    static load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return clone(DEFAULT_STATE);const v=JSON.parse(raw);return {...clone(DEFAULT_STATE),...v,equipped:{...DEFAULT_STATE.equipped,...(v.equipped||{})},highScores:{...DEFAULT_STATE.highScores,...(v.highScores||{})},stickers:Array.isArray(v.stickers)?v.stickers:[],inventory:Array.isArray(v.inventory)?v.inventory:[],unlocked:Array.isArray(v.unlocked)?v.unlocked:[],milestones:Array.isArray(v.milestones)?v.milestones:[]}}catch(e){localStorage.removeItem(STORAGE_KEY);return clone(DEFAULT_STATE)}}
    static save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(gameState))}catch(e){}}
    static reset(){localStorage.removeItem(STORAGE_KEY)}
  }
  const gameState=StorageManager.load();

  class AudioManager{
    constructor(){this.ctx=null}
    init(){if(!gameState.soundEnabled)return;try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}}
    tone(freq=440,dur=.12,type='sine',vol=.055,delay=0){if(!gameState.soundEnabled)return;this.init();if(!this.ctx)return;const t=this.ctx.currentTime+delay,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur+.03)}
    click(){this.tone(420,.07,'sine',.035)} success(){[523,659,784].forEach((n,i)=>this.tone(n,.18,'sine',.05,i*.08))} reward(){[523,659,784,1047].forEach((n,i)=>this.tone(n,.24,'triangle',.06,i*.09))} pop(){this.tone(700,.08,'sine',.04);this.tone(980,.06,'sine',.025,.04)} jump(){this.tone(300,.16,'square',.035);this.tone(520,.12,'square',.025,.09)} softNo(){this.tone(220,.12,'sine',.025);this.tone(190,.14,'sine',.02,.1)} drum(){this.tone(100,.15,'sine',.07)}
    toggle(){gameState.soundEnabled=!gameState.soundEnabled;StorageManager.save();if(gameState.soundEnabled){this.init();this.success()}Game.updateSoundIcons()}
  }
  const Audio=new AudioManager();

  class ParticleSystem{
    constructor(){this.layer=$('#particle-layer');this.count=0;this.max=90}
    burst(x,y,icons=['⭐'],count=12,spread=130){const room=Math.max(0,this.max-this.count);count=Math.min(count,room);for(let i=0;i<count;i++){const p=document.createElement('span');p.className='particle';p.textContent=pick(icons);p.style.cssText=`left:${x}px;top:${y}px;font-size:${rand(15,30)}px;--dx:${rand(-spread,spread)}px;--dy:${rand(-spread,spread*.55)}px;--rot:${rand(-300,300)}deg;--dur:${rand(.65,1.25)}s`;this.layer.appendChild(p);this.count++;p.addEventListener('animationend',()=>{p.remove();this.count--},{once:true})}}
    fromElement(el,icons=['⭐'],count=10){const r=el.getBoundingClientRect();this.burst(r.left+r.width/2,r.top+r.height/2,icons,count)}
    clear(){this.layer.innerHTML='';this.count=0}
  }
  const Particles=new ParticleSystem();

  const Avatar={
    html(cls=''){const equipped=Object.entries(gameState.equipped).map(([slot,id])=>{const it=ITEMS.find(x=>x.id===id);return it?`<span class="wear ${slot}">${it.icon}</span>`:''}).join('');return `<div class="avatar ${cls}"><span>${gameState.character||'🐰'}</span>${equipped}</div>`}
  };

  class SceneManager{
    constructor(){this.cleanups=[];this.name=''}
    cleanup(){this.cleanups.forEach(fn=>{try{fn()}catch(e){}});this.cleanups=[];Particles.clear()}
    onCleanup(fn){this.cleanups.push(fn)}
    show(name,renderer,animate=true){const go=()=>{this.cleanup();this.name=name;renderer();Game.noteActivity()};if(!animate){go();return}const wipe=$('#rainbow-wipe');wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(go,300)}
    interval(fn,ms){const id=setInterval(()=>{if(Game.visible)fn()},ms);this.onCleanup(()=>clearInterval(id));return id}
    timeout(fn,ms){const id=setTimeout(fn,ms);this.onCleanup(()=>clearTimeout(id));return id}
    raf(fn){let id,active=true;const loop=t=>{if(!active)return;fn(t);id=requestAnimationFrame(loop)};id=requestAnimationFrame(loop);this.onCleanup(()=>{active=false;cancelAnimationFrame(id)});return id}
  }
  const Scenes=new SceneManager();

  const Rewards={
    addStars(n,source=''){const old=gameState.stars;gameState.stars+=n;[5,10,20,30,40,50,75,100].forEach(m=>{if(old<m&&gameState.stars>=m&&!gameState.milestones.includes(m)){gameState.milestones.push(m);setTimeout(()=>Game.toast(`⭐ ${m}！`),300)}});StorageManager.save();Game.updateStarUI()},
    sticker(force=false){const available=STICKERS.filter(s=>!gameState.stickers.includes(s));if(!available.length)return;const s=pick(available);gameState.stickers.push(s);StorageManager.save();this.showNew(s);return s},
    item(){const available=ITEMS.filter(i=>!gameState.inventory.includes(i.id));if(!available.length){this.addStars(3);return {icon:'⭐⭐⭐',id:''}}const it=pick(available);gameState.inventory.push(it.id);StorageManager.save();return it},
    showNew(sticker){Game.modal(`<div class="big-new">NEW!</div><div class="new-card">${sticker}</div><div class="result-stars">✨⭐✨</div>`,1200)}
  };

  const Game={
    app:$('#app'),idleTimer:0,lastAction:Date.now(),visible:true,
    start(){document.addEventListener('pointerdown',()=>Audio.init(),{once:true});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{this.visible=!document.hidden;if(!document.hidden)this.noteActivity()});['pointerdown','pointermove'].forEach(ev=>document.addEventListener(ev,()=>this.noteActivity(),{passive:true}));this.playClock=setInterval(()=>{if(this.visible){gameState.totalPlayTime+=5;StorageManager.save();this.checkRest()}},5000);HomeScene.render()},
    noteActivity(){this.lastAction=Date.now();clearTimeout(this.idleTimer);this.idleTimer=setTimeout(()=>{const av=$('.map-player .avatar');if(av){av.classList.add('wave');av.insertAdjacentHTML('beforeend','<span class="idle-spark">✨</span>');setTimeout(()=>{$('.idle-spark')?.remove();av.classList.remove('wave')},2300)}},10000)},
    checkRest(){const gap=gameState.totalPlayTime-gameState.lastRestAt;if(gap>=13*60){gameState.lastRestAt=gameState.totalPlayTime;StorageManager.save();this.restModal()}},
    restModal(){this.modal(`<div class="new-card">${gameState.character||'🐰'}💤</div><h2>休息一下吧～</h2><div class="modal-actions"><button class="big-btn" data-close>🌳 休息</button><button class="big-btn" data-close>▶ 继续</button></div>`)},
    tap(el){Audio.click();el?.animate([{transform:'scale(1)'},{transform:'scale(.9)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:280})},
    topbar(){return `<div class="topbar"><div class="star-pill">⭐ <b data-stars>${gameState.stars}</b></div><div class="spacer"></div><button class="icon-btn small-action" data-action="dress" aria-label="换装">👕</button><button class="icon-btn small-action" data-action="book" aria-label="图鉴">📖</button><button class="icon-btn small-action sound-btn" data-action="sound" aria-label="声音">${gameState.soundEnabled?'🔊':'🔇'}</button></div>`},
    gameHead(title,score=0){return `<div class="game-head"><button class="round-btn" data-back aria-label="返回地图">⬅</button><div class="game-title">${title}</div><button class="round-btn sound-btn" data-action="sound" aria-label="声音" style="width:43px;height:43px;font-size:20px">${gameState.soundEnabled?'🔊':'🔇'}</button><div class="score-bubble">⭐ <b data-score>${score}</b></div></div>`},
    bindCommon(){$$('[data-action]').forEach(b=>b.onclick=()=>{this.tap(b);const a=b.dataset.action;if(a==='sound')Audio.toggle();if(a==='dress')DressScene.open();if(a==='book')BookScene.open();if(a==='character')ChoiceScene.render(true);if(a==='settings')Settings.open()});$$('[data-back]').forEach(b=>b.onclick=()=>{this.tap(b);MapScene.render()})},
    updateSoundIcons(){$$('.sound-btn').forEach(b=>b.textContent=gameState.soundEnabled?'🔊':'🔇')},updateStarUI(){$$('[data-stars]').forEach(e=>e.textContent=gameState.stars)},
    toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;this.app.appendChild(t);setTimeout(()=>t.remove(),1800)},
    modal(html,auto=0){const old=$('.modal');if(old)old.remove();const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="panel">${html}</div>`;this.app.appendChild(m);$$('[data-close]',m).forEach(b=>b.onclick=()=>m.remove());if(auto)setTimeout(()=>m.remove(),auto);return m},
    finish(game,score,reward,replay){gameState.gamesPlayed++;gameState.highScores[game]=Math.max(gameState.highScores[game]||0,score);Rewards.addStars(reward);const newSticker=(gameState.gamesPlayed<=3||Math.random()<.38)?Rewards.sticker():null;StorageManager.save();const showResult=()=>{Audio.reward();const stars='⭐'.repeat(reward);const m=this.modal(`<h2>太棒啦！</h2><div class="result-stars">${stars}</div><div style="font-size:44px;margin:10px">${gameState.character}🎉</div><div class="modal-actions"><button class="big-btn" id="replay">↻ 再玩</button><button class="big-btn" id="to-map">🏝️ 地图</button></div>`);Particles.burst(innerWidth/2,innerHeight/2,['⭐','✨','🎊','💖'],35,innerWidth*.45);$('#replay',m).onclick=()=>{m.remove();replay()};$('#to-map',m).onclick=()=>{m.remove();MapScene.render()}};if(newSticker)setTimeout(showResult,1350);else showResult()}
  };

  const HomeScene={render(){Scenes.show('home',()=>{Game.app.innerHTML=`<section class="scene sky-bg"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="rainbow"></div><div class="bird">🐦</div><div class="bird b2">🐦</div><div class="hill h1"></div><div class="hill h2"></div><div class="grass"></div><div class="river"></div><div class="tree t1">🌳</div><div class="tree t2">🌳</div><div class="hut">🏡</div><div class="butterfly bf1">🦋</div><div class="butterfly bf2">🦋</div><div class="balloon">🎈</div><button class="round-btn sound-btn" data-action="sound" aria-label="声音" style="position:absolute;z-index:50;right:10px;top:calc(10px + env(safe-area-inset-top))">${gameState.soundEnabled?'🔊':'🔇'}</button><div class="title-wrap"><div class="logo-kicker">✨ 大冒险 ✨</div><div class="logo">奇妙<br>动物岛</div></div><div class="hero-animal">${gameState.character||'🐰'}</div><button class="start-btn" aria-label="开始游戏">▶</button><button class="parent-link" data-action="settings" aria-label="家长设置">⚙️</button></section>`;const start=$('.start-btn');let started=false;start.onclick=()=>{if(started)return;started=true;Game.tap(start);Audio.success();Particles.fromElement(start,['⭐','✨'],24);setTimeout(()=>gameState.character?MapScene.render():ChoiceScene.render(),260)};$$('.sun,.cloud,.tree,.hut,.butterfly,.balloon,.rainbow').forEach(el=>el.onclick=e=>{Audio.pop();Particles.burst(e.clientX,e.clientY,['✨','💖','⭐'],8);el.animate([{transform:'scale(1)'},{transform:'scale(1.25) rotate(7deg)'},{transform:'scale(1)'}],{duration:480})});Game.bindCommon()},false)}};

  const ChoiceScene={render(change=false){Scenes.show('choice',()=>{Game.app.innerHTML=`<section class="scene choice-scene"><h1 class="choice-title">选一个好朋友</h1><button class="round-btn sound-btn" data-action="sound" aria-label="声音" style="position:absolute;z-index:50;right:12px;top:calc(12px + env(safe-area-inset-top))">${gameState.soundEnabled?'🔊':'🔇'}</button><div class="choices">${CHARACTERS.map(c=>`<button class="choice-card" aria-label="选择动物"><span>${c}</span></button>`).join('')}</div>${change?'<button class="round-btn" data-back style="position:absolute;left:14px;top:calc(12px + env(safe-area-inset-top))">⬅</button>':''}</section>`;let chosen=false;$$('.choice-card').forEach((b,i)=>b.onclick=()=>{if(chosen)return;chosen=true;b.classList.add('chosen');gameState.character=CHARACTERS[i];StorageManager.save();Audio.reward();Particles.fromElement(b,['⭐','✨','💖'],26);setTimeout(()=>MapScene.render(),700)});Game.bindCommon()})}};

  const MapScene={
    sunHits:0,render(){Scenes.show('map',()=>{this.traveling=false;Game.app.innerHTML=`<section class="scene map-scene">${Game.topbar()}<div class="island"><button class="place p-fruit" data-game="fruit">🍎<small>水果森林</small></button><button class="place p-animal" data-game="animal">🐾<small>动物乐园</small></button><button class="place p-color" data-game="color">🌈<small>魔法屋</small></button><button class="place p-train" data-game="train">🚂<small>小火车</small></button><button class="place p-bubble" data-game="bubble">🌊<small>泡泡世界</small></button><button class="place p-music" data-game="music">🎵<small>音乐会</small></button><div class="map-player">${Avatar.html()}</div><span class="map-egg egg-sun" data-egg="sun">☀️</span><span class="map-egg egg-cloud" data-egg="cloud">☁️</span><span class="map-egg egg-tree" data-egg="tree">🌳</span><span class="map-egg egg-apple" data-egg="apple">🍎</span><span class="map-egg egg-pond" data-egg="pond">💧</span><span class="map-egg egg-flower" data-egg="flower">🌼</span><span class="map-egg egg-house" data-egg="house">🏠</span><span class="map-egg egg-wind" data-egg="wind">🎡</span><span class="map-egg egg-rock" data-egg="rock">🪨</span><span class="map-egg egg-rainbow" data-egg="rainbow">🌈</span><span class="map-egg egg-bird" data-egg="bird">🐦</span><span class="map-egg egg-mush" data-egg="mush">🍄</span><span class="map-egg egg-balloon" data-egg="balloon">🎈</span><span class="map-egg egg-bush" data-egg="bush">🌿</span><span class="map-egg egg-river" data-egg="river">🌊</span><span class="chest-map ${this.chestReady()?'':'locked'}" aria-label="魔法宝箱">🎁</span></div><button class="parent-link" data-action="settings">⚙️</button><button class="round-btn" data-action="character" style="position:absolute;z-index:50;left:8px;bottom:calc(7px + env(safe-area-inset-bottom));font-size:22px">🔄</button></section>`;$$('.place').forEach(p=>p.onclick=()=>this.travel(p));$$('.map-egg').forEach(e=>e.onclick=ev=>this.egg(e,ev));$('.chest-map').onclick=()=>this.openChest();Game.bindCommon();RandomEvents.arm()})},
    chestReady(){return Math.floor(gameState.stars/10)>gameState.chestsOpened},
    travel(place){if(this.traveling)return;this.traveling=true;Game.tap(place);Audio.jump();const player=$('.map-player'),island=$('.island').getBoundingClientRect(),r=place.getBoundingClientRect();player.style.left=`${(r.left+r.width/2-island.left)/island.width*100}%`;player.style.top=`${(r.top+r.height/2-island.top)/island.height*100}%`;setTimeout(()=>({fruit:FruitGame,animal:AnimalGame,color:ColorGame,train:TrainGame,bubble:BubbleGame,music:MusicGame}[place.dataset.game].start()),780)},
    egg(el,e){const type=el.dataset.egg;Audio.pop();Particles.burst(e.clientX,e.clientY,type==='pond'||type==='river'?['💧','🐟']:['⭐','✨','💖'],10);const reactions={sun:'😎',cloud:'💖',tree:'🍎',apple:'🍎',pond:'🐟',flower:'🦋',house:'🐿️',wind:'🌀',rock:'🐞',rainbow:'⭐',bird:'🕊️',mush:'🍄',balloon:'🎈',bush:'🐰',river:'💦'};if(type==='sun'&&++this.sunHits>=5)el.textContent='😎';else if(type==='cloud')el.textContent='💖';else if(type==='tree'){const a=document.createElement('span');a.className='map-egg';a.textContent='🍎';a.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;position:fixed;animation:fall 1.2s linear forwards`;Game.app.appendChild(a);setTimeout(()=>a.remove(),1200)}else el.textContent=reactions[type];el.animate([{transform:'scale(.8)'},{transform:'scale(1.4) rotate(15deg)'},{transform:'scale(1)'}],{duration:550})},
    openChest(){if(!this.chestReady()){Audio.softNo();Game.toast(`还差 ${10-gameState.stars%10} ⭐`);return}const box=$('.chest-map');box.classList.add('chest-open');Audio.reward();setTimeout(()=>{gameState.chestsOpened++;const it=Rewards.item();StorageManager.save();const m=Game.modal(`<h2>魔法宝箱</h2><div class="chest-open">📦</div><div class="new-card">${it.icon}</div><div class="big-new">得到啦！</div><button class="big-btn" data-close style="width:140px;height:60px;border-radius:30px">✓</button>`);Particles.burst(innerWidth/2,innerHeight/2,['⭐','🎊','✨','💖'],38,innerWidth*.45);$('[data-close]',m).onclick=()=>{m.remove();this.render()}},800)}
  };

  class BaseGame{constructor(id,title){this.id=id;this.title=title;this.score=0}shell(cls,inside){Game.app.innerHTML=`<section class="scene ${cls}">${Game.gameHead(this.title,this.score)}<div class="game-area">${inside}</div></section>`;Game.bindCommon()}scoreUp(n=1){this.score+=n;const el=$('[data-score]');if(el)el.textContent=this.score;Audio.success()}}

  const FruitGame=new class extends BaseGame{constructor(){super('fruit','🍎 大丰收')}start(){Scenes.show(this.id,()=>{this.score=0;this.time=60;this.ended=false;this.shell('fruit-scene',`<div class="fruit-tree left">🌳</div><div class="fruit-tree right">🌳</div><div class="hint">⏱️ <b id="fruit-time">60</b></div><div class="basket">🧺</div>`);const area=$('.game-area'),basket=$('.basket');const move=x=>basket.style.left=`${clamp(x,45,innerWidth-45)}px`;area.onpointermove=e=>{if(e.buttons||e.pointerType==='touch')move(e.clientX)};area.onpointerdown=e=>{if(!e.target.classList.contains('falling'))move(e.clientX)};this.spawnTimer=Scenes.interval(()=>this.spawn(),650);this.clockTimer=Scenes.interval(()=>{this.time--;$('#fruit-time').textContent=this.time;if(this.time<=0&&!this.ended){this.ended=true;clearInterval(this.spawnTimer);clearInterval(this.clockTimer);clearInterval(this.hitTimer);const reward=this.score>=36?3:this.score>=18?2:1;Game.finish(this.id,this.score,reward,()=>this.start())}},1000);this.hitTimer=Scenes.interval(()=>this.collide(),90)})}spawn(){if(Scenes.name!==this.id||this.ended)return;const f=document.createElement('button'),special=Math.random();f.className='falling';f.textContent=special<.07?'⭐':special<.13?'💣':pick(['🍎','🍓','🍊','🍌','🍉','🍇']);f.style.left=`${rand(7,87)}%`;f.style.animationDuration=`${this.time>40?rand(4.5,5.5):this.time>20?rand(3.5,4.6):rand(2.6,3.7)}s`;f.onclick=e=>{e.stopPropagation();this.catch(f)};$('.game-area').appendChild(f);f.addEventListener('animationend',()=>f.remove(),{once:true})}catch(f){if(!f.isConnected||this.ended)return;if(f.textContent==='💣'){Audio.softNo();Particles.fromElement(f,['💨','▪️'],12);Game.toast('噗！');$('.basket').animate([{transform:'translateX(-50%) rotate(-8deg)'},{transform:'translateX(-50%) rotate(8deg)'},{transform:'translateX(-50%)'}],{duration:500})}else{this.scoreUp(f.textContent==='⭐'?3:1);Particles.fromElement(f,['⭐','✨'],9)}f.remove()}collide(){const b=$('.basket')?.getBoundingClientRect();if(!b)return;$$('.falling').forEach(f=>{const r=f.getBoundingClientRect();if(r.bottom>b.top+20&&r.left<b.right&&r.right>b.left)this.catch(f)})}};

  const AnimalGame=new class extends BaseGame{constructor(){super('animal','🐾 找朋友')}start(){Scenes.show(this.id,()=>{this.score=0;this.round=0;this.shell('animal-scene','<div class="target-ring"></div><div class="answers"></div>');this.next()})}next(){if(this.round>=8){Game.finish(this.id,this.score,this.score>=8?3:this.score>=5?2:1,()=>this.start());return}this.round++;const counts=[2,2,3,3,4,4,6,6],all=['🐰','🐼','🐶','🐱','🦊','🐸','🐵','🐯','🐧','🦁'],count=counts[this.round-1],opts=shuffle(all).slice(0,count);this.target=pick(opts);$('.target-ring').textContent=this.target;$('.answers').innerHTML=opts.map(a=>`<button class="answer">${a}</button>`).join('');$$('.answer').forEach(b=>b.onclick=()=>{if(b.textContent===this.target){b.classList.add('correct');this.scoreUp();Particles.fromElement(b,['⭐','🌈','✨'],18);setTimeout(()=>this.next(),850)}else{Audio.softNo();b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),450)}})}};

  const COLORS=['#ff5f6f','#ffd447','#4ea5ff','#55d472','#ff83c5','#a978ed'];
  const ColorGame=new class extends BaseGame{constructor(){super('color','🌈 颜色魔法')}start(){Scenes.show(this.id,()=>{this.score=0;this.round=0;this.shell('color-scene','<div class="magic-house"></div><div class="target-color"></div><div class="orbs"></div>');this.next()})}next(){if(this.round>=8){Game.finish(this.id,this.score,this.score>=10?3:this.score>=7?2:1,()=>this.start());return}this.round++;this.target=pick(COLORS);this.need=this.round>5?2:1;this.found=0;$('.target-color').style.background=this.target;$('.target-color').style.color=this.target;let colors=shuffle([...COLORS,...(this.need===2?[this.target]:[])]).slice(0,6);if(colors.filter(c=>c===this.target).length<this.need){colors[0]=this.target;if(this.need===2)colors[1]=this.target}$('.orbs').innerHTML=shuffle(colors).map(c=>`<button class="color-orb" style="background:${c};border-top-color:${c}" data-color="${c}"></button>`).join('');$$('.color-orb').forEach(b=>b.onclick=()=>{if(b.dataset.color===this.target){b.classList.add('pop');this.found++;this.scoreUp();Particles.fromElement(b,['⭐','🎊','✨'],15);if(this.found>=this.need)setTimeout(()=>this.next(),650)}else{Audio.softNo();b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),420)}})}};

  const TrainGame=new class extends BaseGame{constructor(){super('train','🚂 彩虹列车');this.zones=['🌲 森林','🌸 花海','🏘️ 小镇','🏔️ 雪山','🌈 天空']}start(){Scenes.show(this.id,()=>{this.score=0;this.distance=0;this.last=0;this.jumping=false;this.rainbow=0;this.streak=0;this.zone=-1;this.shell('train-scene','<div class="parallax far"></div><div class="parallax mid"></div><div class="parallax near"></div><div class="tracks"></div><div class="meter"><span id="zone-label">🌲 森林</span> · <b id="meter">0</b> 米</div><div class="train">🚂</div>');const area=$('.game-area');area.onpointerdown=e=>{if(e.target.closest('[data-back]'))return;this.jump()};const back=$('[data-back]');back.onclick=()=>{gameState.highScores.train=Math.max(gameState.highScores.train||0,Math.floor(this.distance));StorageManager.save();MapScene.render()};Scenes.interval(()=>this.spawn(),900);Scenes.raf(t=>this.tick(t))})}jump(){if(this.jumping)return;this.jumping=true;Audio.jump();$('.train').classList.add('jump');Scenes.timeout(()=>{this.jumping=false;$('.train')?.classList.remove('jump')},700)}spawn(){if(Scenes.name!==this.id)return;const good=Math.random()>.32,el=document.createElement('span');el.className=good?'track-item':'obstacle';el.textContent=good?pick(['⭐','🍭','🎈','💎']):pick(['📦','🪨','💧']);el.dataset.good=good?'1':'0';el.style.animationDuration=`${rand(3.1,4.1)}s`;$('.game-area').appendChild(el);el.addEventListener('animationend',()=>el.remove(),{once:true})}tick(t){if(!Game.visible)return;if(!this.last)this.last=t;const dt=Math.min(40,t-this.last);this.last=t;const boost=Date.now()<this.rainbow?1.65:1;const previous=this.distance;this.distance+=dt*.018*boost;$('#meter').textContent=Math.floor(this.distance);const nextZone=Math.floor(this.distance/300)%5;if(nextZone!==this.zone){this.zone=nextZone;const scene=$('.train-scene');scene.className=`scene train-scene zone-${nextZone}`;$('#zone-label').textContent=this.zones[nextZone];if(this.distance>20)Game.toast(this.zones[nextZone])}const tr=$('.train')?.getBoundingClientRect();if(!tr)return;$$('.track-item,.obstacle').forEach(el=>{if(el.dataset.hit)return;const r=el.getBoundingClientRect();if(r.left<tr.right&&r.right>tr.left&&r.bottom>tr.top&&r.top<tr.bottom){el.dataset.hit='1';if(el.dataset.good==='1'){this.scoreUp();this.streak++;Particles.fromElement(el,['⭐','🌈'],10);if(this.streak>=5){this.streak=0;this.rainbow=Date.now()+5000;Game.toast('🌈 彩虹冲刺！')}}else{this.streak=0;Audio.softNo();Particles.fromElement(el,['💫'],8);$('.train').animate([{transform:'rotate(-8deg)'},{transform:'rotate(8deg)'},{transform:'rotate(0)'}],{duration:450})}el.remove()}});if(Math.floor(this.distance/150)>Math.floor(previous/150)){Rewards.addStars(1);gameState.highScores.train=Math.max(gameState.highScores.train||0,Math.floor(this.distance));StorageManager.save();Game.toast('+ ⭐')}}};

  const BubbleGame=new class extends BaseGame{constructor(){super('bubble','🌊 泡泡世界')}start(){Scenes.show(this.id,()=>{this.score=0;this.time=50;this.combo=0;this.ended=false;this.shell('bubble-scene','<div class="water-light"></div><div class="fish-bg f1">🐠</div><div class="fish-bg f2">🐟</div><div class="seabed"></div><div class="coral c1">🪸</div><div class="coral c2">🌿</div><div class="hint">⏱️ <b id="bubble-time">50</b></div>');this.spawnTimer=Scenes.interval(()=>this.spawn(),520);this.clockTimer=Scenes.interval(()=>{this.time--;$('#bubble-time').textContent=this.time;if(this.time<=0&&!this.ended){this.ended=true;clearInterval(this.spawnTimer);clearInterval(this.clockTimer);Game.finish(this.id,this.score,this.score>=30?3:this.score>=15?2:1,()=>this.start())}},1000)})}spawn(){if(Scenes.name!==this.id||this.ended)return;const b=document.createElement('button'),superB=Math.random()<.16,size=superB?rand(85,120):rand(48,83);b.className=`bubble${superB?' super':''}`;b.style.cssText=`left:${rand(2,88)}%;width:${size}px;height:${size}px;--drift:${rand(-70,70)}px;animation-duration:${rand(5,9)}s`;b.textContent=Math.random()<.38?pick(['⭐','🍓','🐠','🐙','🐳','🎁']):'';b.dataset.hp=superB?'3':'1';b.onclick=()=>this.pop(b);$('.game-area').appendChild(b);b.addEventListener('animationend',()=>b.remove(),{once:true})}pop(b){if(this.ended)return;let hp=+b.dataset.hp-1;b.dataset.hp=hp;Audio.pop();b.classList.add('hit');Scenes.timeout(()=>b.classList.remove('hit'),230);if(hp<=0){this.scoreUp(b.classList.contains('super')?3:1);this.combo++;Particles.fromElement(b,b.classList.contains('super')?['⭐','🎊','🐠','✨']:['🫧','✨'],b.classList.contains('super')?22:8);b.remove();if(this.combo===10){Game.toast('🐳 鲸鱼来啦！');const w=document.createElement('div');w.className='fish-bg';w.style.cssText='font-size:110px;top:35%;left:-25%;animation-duration:4s';w.textContent='🐳';$('.game-area').appendChild(w);Scenes.timeout(()=>w.remove(),4200)}}}};

  const MusicGame=new class extends BaseGame{constructor(){super('music','🎵 动物音乐会');this.icons=['🥁','🎹','🔔','🎺','👏'];this.freq=[110,523,880,392,240]}start(){Scenes.show(this.id,()=>{this.score=0;this.mode='free';this.special=[];this.shell('music-scene',`<div class="stage-light sl1"></div><div class="stage-light sl2"></div><div class="music-modes"><button class="mode-btn on" data-mode="free">🎶 自由</button><button class="mode-btn" data-mode="challenge">✨ 跟着弹</button></div><div class="stage"></div><div class="band"><span>${gameState.character}</span><span>🐼</span><span>🦊</span></div><div class="instruments">${this.icons.map((x,i)=>`<button class="instrument" data-note="${i}">${x}</button>`).join('')}</div>`);$$('.instrument').forEach(b=>b.onclick=()=>this.play(+b.dataset.note,b));$$('.mode-btn').forEach(b=>b.onclick=()=>this.setMode(b.dataset.mode))})}sound(i){if(i===0)Audio.drum();else Audio.tone(this.freq[i],.22,i===3?'sawtooth':'sine',.045)}play(i,b){this.sound(i);b.animate([{transform:'scale(.9)'},{transform:'scale(1.15) rotate(6deg)'},{transform:'scale(1)'}],{duration:280});Particles.fromElement(b,['♪','♫','✨'],6);this.special.push(i);this.special=this.special.slice(-4);if(this.special.join(',')==='0,1,2,3')this.party();if(this.mode==='challenge'){if(i===this.sequence[this.input]){this.input++;if(this.input===this.sequence.length){this.scoreUp();this.party();setTimeout(()=>this.newSequence(),1100)}}else{Audio.softNo();this.input=0;setTimeout(()=>this.flash(),450)}}}setMode(mode){this.mode=mode;$$('.mode-btn').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));if(mode==='challenge')this.newSequence()}newSequence(){this.sequence=Array.from({length:Math.min(3+this.score,6)},()=>Math.floor(Math.random()*5));this.input=0;this.flash()}flash(){let delay=0;this.sequence.forEach((n,i)=>{setTimeout(()=>{const b=$$(`.instrument`)[n];b?.classList.add('lit');this.sound(n);setTimeout(()=>b?.classList.remove('lit'),320)},delay+i*560)});if(this.score>=4)setTimeout(()=>Game.finish(this.id,this.score,3,()=>this.start()),this.sequence.length*560+500)}party(){Audio.reward();$('.band')?.classList.add('party');Particles.burst(innerWidth/2,innerHeight*.45,['🎊','⭐','♪','💖'],28,innerWidth*.42);setTimeout(()=>$('.band')?.classList.remove('party'),1200)}};

  const DressScene={open(){const groups=['hat','glasses','accessory'];let tab='hat';const draw=()=>{const owned=ITEMS.filter(i=>gameState.inventory.includes(i.id)&&i.slot===tab);const m=Game.modal(`<h2>👕 换装</h2><div class="dress-avatar">${Avatar.html()}</div><div class="tabs">${groups.map(g=>`<button class="tab ${g===tab?'on':''}" data-tab="${g}">${g==='hat'?'👑':g==='glasses'?'👓':'🎀'}</button>`).join('')}</div><div class="collection"><button class="item-btn" data-item="">🚫</button>${owned.map(i=>`<button class="item-btn ${gameState.equipped[tab]===i.id?'equipped':''}" data-item="${i.id}">${i.icon}</button>`).join('')}</div><div class="modal-actions"><button class="big-btn" data-close>✓</button></div>`);$$('[data-tab]',m).forEach(b=>b.onclick=()=>{tab=b.dataset.tab;m.remove();draw()});$$('[data-item]',m).forEach(b=>b.onclick=()=>{gameState.equipped[tab]=b.dataset.item;StorageManager.save();Audio.success();m.remove();draw()})};draw()}};
  const BookScene={open(){Game.modal(`<h2>📖 我的图鉴</h2><div class="collection">${STICKERS.map(s=>`<div class="sticker ${gameState.stickers.includes(s)?'':'locked'}">${gameState.stickers.includes(s)?s:'❓'}</div>`).join('')}</div><div class="modal-actions"><button class="big-btn" data-close>✓</button></div>`)}};
  const Settings={open(){const m=Game.modal(`<h2>⚙️ 家长设置</h2><div class="settings-row"><span>声音</span><button class="switch ${gameState.soundEnabled?'on':''}" id="sound-switch" aria-label="声音开关"></button></div><p style="font-size:15px;color:#7b6c93">按住 3 秒重置</p><button class="hold-reset" id="hold-reset"><span class="progress"></span><b>🔒 重置游戏</b></button><div class="modal-actions"><button class="big-btn" data-close>✓</button></div>`);$('#sound-switch',m).onclick=e=>{Audio.toggle();e.currentTarget.classList.toggle('on',gameState.soundEnabled)};const btn=$('#hold-reset',m),progress=$('.progress',btn);let start=0,raf=0;const stop=()=>{cancelAnimationFrame(raf);start=0;progress.style.width='0'};const tick=()=>{const pct=Math.min(100,(performance.now()-start)/30);progress.style.width=pct+'%';if(pct>=100){StorageManager.reset();location.reload();return}raf=requestAnimationFrame(tick)};btn.onpointerdown=e=>{e.preventDefault();start=performance.now();tick()};btn.onpointerup=btn.onpointercancel=btn.onpointerleave=stop}};

  const RandomEvents={timer:0,arm(){clearTimeout(this.timer);const wait=rand(120000,300000);this.timer=setTimeout(()=>{if(Scenes.name==='map')this.show();else this.arm()},wait);Scenes.onCleanup(()=>clearTimeout(this.timer))},show(){const types=['🌈','🎈','🦄','🎁','⭐','🐥'],type=pick(types),obj=document.createElement('button');obj.className='event-object center';obj.innerHTML=`<span class="event-label">✨</span>${type}`;Game.app.appendChild(obj);obj.onclick=()=>{Audio.reward();Particles.fromElement(obj,['⭐','🎊','💖'],30);if(type==='🦄')Rewards.sticker();else if(type==='🎁'){const it=Rewards.item();Game.toast(`${it.icon} 得到啦！`)}else Rewards.addStars(type==='⭐'?3:2);obj.remove();this.arm()};setTimeout(()=>{if(obj.isConnected){obj.remove();this.arm()}},15000)}};

  Game.start();
})();
